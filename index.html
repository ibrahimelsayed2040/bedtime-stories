<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0a26">
<title>Bedtime Stories</title>
<script>document.documentElement.lang='ar';document.documentElement.dir='rtl';</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;700;800&family=Lalezar&display=swap">
<style>
/* Layout: full-screen stages over a living starfield — star title → flying pop-up book → planet carousel → rocket + cloud dive → a cartoon world that stays behind the story and falls asleep with it (RTL, Arabic) */
:root{
  --night:#0c0a26;
  --paper:#fff6e4;
  --paper-edge:#e9d6ae;
  --ink:#34245e;
  --gold:#ffd166;
  --rose:#ff7eb6;
  --star:#f4efff;
  --muted:#c3bbe8;
  --display:'Lalezar','Baloo Bhaijaan 2','Tahoma',sans-serif;
  --body:'Baloo Bhaijaan 2','Tahoma','Segoe UI',sans-serif;
  color-scheme:dark;
  direction:rtl;
}
html,body{height:100%;overflow:hidden}
body{background:var(--night);color:var(--star);font-family:var(--body);touch-action:manipulation;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--gold);outline-offset:4px;border-radius:12px}

#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.nebula{position:fixed;inset:-6%;z-index:0;pointer-events:none;transition:transform 1.2s cubic-bezier(.2,.8,.3,1);
  transform:translate(calc(var(--mx,0) * -24px),calc(var(--my,0) * -18px));
  background:
    radial-gradient(60vmax 40vmax at 12% 18%, rgba(123,79,224,.3), transparent 70%),
    radial-gradient(50vmax 35vmax at 88% 80%, rgba(255,126,182,.2), transparent 70%),
    radial-gradient(40vmax 30vmax at 70% 10%, rgba(80,160,255,.16), transparent 70%)}

/* ---------- the cartoon world (shared by intro + reader) ---------- */
#world{position:fixed;inset:0;z-index:1;opacity:0;visibility:hidden;transition:opacity .8s,visibility 0s linear .8s;pointer-events:none;--s:0}
#world.on{opacity:1;visibility:visible;transition:opacity .8s}
#world svg{width:100%;height:100%;display:block}
#world .sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite}
#world .w-prop:nth-of-type(2n) .sway{animation-delay:-1.3s;animation-duration:4.6s}
.w-prop,.w-hero{transform-box:fill-box;transform-origin:50% 100%}
.w-skynight{opacity:calc(var(--s) * .9);transition:opacity 1.8s}
.w-stars{opacity:var(--s);transition:opacity 1.8s}
.w-tw{transform-box:fill-box;transform-origin:center;animation:twinkle 2.6s ease-in-out infinite}
.w-sun{transform:translateY(calc(var(--s) * 560px));transition:transform 2.2s cubic-bezier(.4,0,.2,1)}
.w-moon{transform:translateY(calc((1 - var(--s)) * 560px));transition:transform 2.2s cubic-bezier(.4,0,.2,1)}
.w-rays{transform-box:fill-box;transform-origin:center;animation:rot 30s linear infinite}
.w-clouds{opacity:calc(1 - var(--s) * .45);transition:opacity 1.8s}
.w-cloud{animation:drift linear infinite}
.w-day{opacity:calc(1 - var(--s) * 1.4);transition:opacity 1.6s}
.w-nl{opacity:calc(var(--s) * 1.3 - .2);transition:opacity 1.6s}
.w-landnight{opacity:calc(var(--s) * .42);transition:opacity 1.8s}
.w-ff{animation:ffly 4s ease-in-out infinite}
.w-wave{animation:waveX 5s linear infinite}
.w-flyx{animation:flyx linear infinite}
.w-flyx.rev{animation-direction:reverse}
.w-flap{transform-box:fill-box;transform-origin:center;animation:flapY .28s ease-in-out infinite alternate}
.w-bfly{animation:bfly 9s ease-in-out infinite}
.w-bw{transform-box:fill-box;animation:bw .16s ease-in-out infinite alternate}
.w-bw.l{transform-origin:100% 50%}.w-bw.r{transform-origin:0 50%}
.w-bob{transform-box:fill-box;animation:bobY 4s ease-in-out infinite}
.w-sm{transform-box:fill-box;transform-origin:center;animation:smoke 3.3s ease-out infinite}
.w-hand{transform-box:fill-box;transform-origin:50% 100%;animation:rot 6s linear infinite}
.w-hand2{transform-box:fill-box;transform-origin:50% 100%;animation:rot 40s linear infinite}
.w-beam{transform-box:fill-box;transform-origin:0 50%;animation:beam 3.2s ease-in-out infinite}
.w-flag{transform-box:fill-box;transform-origin:0 50%;animation:flag .8s ease-in-out infinite alternate}
.w-bub{transform-box:fill-box;animation:bub 5s ease-in infinite}
.w-rain{animation:rain .7s linear infinite}
.w-petal{transform-box:fill-box;animation:petal linear infinite}
.w-aur{transform-box:fill-box;transform-origin:50% 0;animation:aur 7s ease-in-out infinite alternate}
.w-glow{animation:glowP 2.6s ease-in-out infinite}
.w-win{opacity:calc(.55 + var(--s) * .45)}

/* ---------- critters (heroes) ---------- */
.hero{transform-box:fill-box;transform-origin:50% 100%;animation:heroBob 1.7s ease-in-out infinite}
.h-arm{transform-box:fill-box;transform-origin:15% 85%;animation:armWave 3.4s ease-in-out infinite}
.h-wing{transform-box:fill-box;transform-origin:100% 60%;animation:flapL .5s ease-in-out infinite alternate}
.h-wing.r{transform-origin:0 60%;animation-name:flapR}
.k-bug .h-wing{animation-duration:.12s}
.h-tail{transform-box:fill-box;transform-origin:0 100%;animation:tailW 1.4s ease-in-out infinite}
.h-spout{transform-box:fill-box;transform-origin:50% 100%;animation:spout 2.4s ease-in-out infinite}
.h-glow{animation:glowP 1.5s ease-in-out infinite}
.h-bulb{animation:bulb 1s steps(2) infinite}
.h-tent{transform-box:fill-box;transform-origin:50% 0;animation:tent 1.6s ease-in-out infinite}
.h-lid{transform-box:fill-box;transform-origin:center;transition:transform .8s}
.h-open{transform-box:fill-box;transform-origin:center;animation:blink 3.6s infinite}
.h-shut{opacity:0}
.hero.sleepy .h-lid{transform:scaleY(.45)}
.hero.sleep .h-open{opacity:0}
.hero.sleep .h-shut{opacity:1}
.hero.sleep{animation:heroSleep 4s ease-in-out infinite}
.hero.sleep .h-arm,.hero.sleep .h-wing,.hero.sleep .h-tail,.hero.sleep .h-tent{animation-play-state:paused}
.hero.waving .h-arm{animation:armFast .45s ease-in-out 5}

.scene{position:fixed;inset:0;z-index:2;opacity:0;visibility:hidden;transition:opacity .7s ease,visibility 0s linear .7s}
.scene.on{opacity:1;visibility:visible;transition:opacity .7s ease}
.scene.instant{transition:none}
.fxc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:block}
#flash{position:fixed;inset:0;z-index:50;background:#fff;opacity:0;pointer-events:none}

/* ---------- 1. The book ---------- */
#bookScene{display:grid;place-items:center;cursor:pointer}
.beams{position:absolute;left:50%;top:50%;width:220vmax;height:220vmax;margin:-110vmax 0 0 -110vmax;opacity:0;pointer-events:none}
.beams>div{position:absolute;inset:0;border-radius:50%;animation:rot 40s linear infinite;
  background:repeating-conic-gradient(from 0deg,rgba(255,221,140,.34) 0 5deg,rgba(255,221,140,0) 5deg 15deg);
  -webkit-mask:radial-gradient(circle,#000 0,#000 8%,transparent 42%);mask:radial-gradient(circle,#000 0,#000 8%,transparent 42%)}
.book-in{position:relative;visibility:hidden}
.book-float{position:relative;perspective:2200px;animation:floaty 5s ease-in-out infinite}
.book{position:relative;width:min(78vw,56vh);aspect-ratio:3/4.15;transform-style:preserve-3d;container-type:inline-size;
  transform:rotateY(calc(var(--mx,0) * 16deg)) rotateX(calc(var(--my,0) * -10deg));transition:transform .6s cubic-bezier(.2,.8,.3,1)}
.peek{position:absolute;right:10%;top:0;width:34%;transform:translateY(0);pointer-events:none}
#bookScene.alive .peek{animation:peek 7s ease-in-out infinite 1s}
#bookScene.alive .peek .pk-paw{transform-box:fill-box;transform-origin:50% 100%;animation:pkwave 7s ease-in-out infinite 1s}
.pages{position:absolute;inset:1.5% 0;background:var(--paper);border-radius:12px 4px 4px 12px;
  box-shadow:-3px 3px 0 var(--paper-edge),-6px 6px 0 #f5e8cb,-9px 9px 0 var(--paper-edge),-12px 12px 0 #efdfbd,0 30px 60px rgba(0,0,0,.55);overflow:hidden}
.pages::before{content:"";position:absolute;inset:0;background:linear-gradient(270deg,rgba(90,60,20,.22),transparent 12%);z-index:1;pointer-events:none}
.popup-art{position:absolute;inset:0;width:100%;height:100%}
.pop{transform-box:fill-box;transform-origin:50% 100%;transform:scale(0)}
.page-glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,#fff 0,rgba(255,230,160,.9) 30%,rgba(255,209,102,0) 70%);opacity:0;transition:opacity 1s ease;pointer-events:none;z-index:2}
.book.lit .page-glow{opacity:1}
.leafp{position:absolute;inset:1.5% 0;border-radius:12px 4px 4px 12px;transform-origin:right center;visibility:hidden;
  background:repeating-linear-gradient(180deg,transparent 0 5.5cqw,rgba(52,36,94,.09) 5.5cqw 6.2cqw) 10cqw 12cqw/calc(100% - 20cqw) calc(100% - 26cqw) no-repeat,
             linear-gradient(270deg,rgba(90,60,20,.18),transparent 14%),#fffaf0;
  box-shadow:0 0 0 1px rgba(90,60,20,.12)}
.cover{position:absolute;inset:0;transform-origin:right center;transform-style:preserve-3d;transform:translateZ(1px)}
.cover>div{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px 6px 6px 16px;overflow:hidden}
.cover-front{
  background:
    linear-gradient(270deg,rgba(0,0,0,.45) 0,rgba(255,255,255,.08) 3.5%,rgba(0,0,0,.25) 6%,transparent 10%),
    radial-gradient(120% 90% at 50% 20%,#3b2aa0 0,#241873 55%,#150d4a 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 30px 70px rgba(0,0,0,.6);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 9cqw 12cqw}
.cover-front::after{content:"";position:absolute;inset:4.5cqw 8cqw 4.5cqw 4.5cqw;border:.7cqw double var(--gold);border-radius:3cqw;opacity:.75;pointer-events:none}
.cover-front::before{content:"";position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.18) 50%,transparent 58%);animation:gloss 5s ease-in-out infinite;pointer-events:none}
.cover-art{position:absolute;left:0;right:0;top:5cqw;width:100%;height:auto}
.cover-art .tw{animation:twinkle 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.cover-art .tw:nth-of-type(2n){animation-delay:-1.2s}
.cover-art .tw:nth-of-type(3n){animation-delay:-.6s}
.cover-moon{animation:rock 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 60%}
.cover-planet{animation:bobY 3.4s ease-in-out infinite;transform-box:fill-box}
.cover-title{position:relative;font-family:var(--display);font-weight:400;text-align:center;font-size:19cqw;line-height:1.05;margin:0;
  background:linear-gradient(110deg,#f2a33a 0,#ffd166 30%,#fffbe8 42%,#ffd166 54%,#f2a33a 100%) 0 0/260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 .8cqw 0 #7a3f12) drop-shadow(0 2cqw 3cqw rgba(0,0,0,.5));animation:sheen 3.6s ease-in-out infinite}
.cover-sub{position:relative;margin:2cqw 0 0;font-size:5.4cqw;color:#e9e0ff;font-weight:700}
.cover-back{transform:rotateY(180deg);
  background:radial-gradient(circle at 20% 20%,rgba(255,209,102,.9) 0 .7cqw,transparent 1cqw) 0 0/11cqw 11cqw,
             radial-gradient(circle at 70% 60%,rgba(255,255,255,.7) 0 .5cqw,transparent .8cqw) 0 0/14cqw 14cqw,#5a3fc6}
.tap-hint{position:absolute;left:0;right:0;bottom:max(3vh,18px);text-align:center;margin:0;font-family:var(--display);font-size:clamp(1.2rem,2.6vw,1.6rem);color:var(--gold);opacity:0;pointer-events:none}
.tap-hint span{display:inline-block;animation:pulse 1.8s ease-in-out infinite}

/* ---------- 2. Planet carousel ---------- */
#galaxy{display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);overflow:hidden}
.g-head{position:relative;z-index:2;padding:clamp(16px,3.5vh,36px) 16px 0;text-align:center}
.g-brand{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);color:var(--gold);font-size:1.15rem}
.g-title{margin:.15em 0 .1em;font-family:var(--display);font-weight:400;font-size:clamp(2.2rem,6.4vw,3.9rem);line-height:1.15;color:#fff;
  -webkit-text-stroke:7px #3d2a9c;paint-order:stroke fill;text-shadow:0 5px 0 rgba(0,0,0,.35)}
.g-title .w{display:inline-block;margin:0 .12em}
.g-title .w.wave{animation:wave 2.2s ease-in-out infinite;animation-delay:calc(var(--i) * -.3s)}
.g-sub{margin:0;color:var(--muted);font-size:clamp(1rem,2vw,1.15rem)}
.strip-wrap{position:relative;z-index:2;min-height:0;min-width:0;display:flex;align-items:center}
.strip{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;width:100%;height:100%;align-items:center;
  scroll-snap-type:x proximity;scrollbar-width:none;padding-inline:calc(50% - var(--cw)/2);--cw:min(260px,56vw)}
.strip::-webkit-scrollbar{display:none}
.pcard{flex:0 0 var(--cw);scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;padding:34px 0 10px;border-radius:24px}
.pinner{width:100%;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .25s ease-out,opacity .25s;will-change:transform}
.pwrap{width:86%;position:relative;animation:floaty 6s ease-in-out infinite}
.pcard:nth-child(2n) .pwrap{animation-delay:-2s}
.pcard:nth-child(3n) .pwrap{animation-delay:-4s}
.pwrap::before{content:"";position:absolute;inset:-4%;border-radius:50%;border:3px dashed rgba(255,209,102,.7);opacity:0;transform:scale(.8);transition:opacity .4s,transform .4s}
.pcard.focus .pwrap::before{opacity:1;transform:scale(1);animation:rot 14s linear infinite}
.pplanet{transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.pcard:hover .pplanet{transform:scale(1.07,.95)}
.pcard:hover .pwrap svg.planet-svg{filter:drop-shadow(0 0 22px rgba(255,255,255,.4))}
.phero{position:absolute;left:50%;top:-17%;width:38%;translate:-50% 0;z-index:2;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.phero svg{width:100%;height:auto;display:block;overflow:visible}
.pcard:hover .phero{transform:translateY(-14px) rotate(-6deg)}
.pcard.focus .phero .h-arm{animation:armFast .45s ease-in-out infinite}
.pname{font-family:var(--display);font-size:clamp(1.35rem,2.6vw,1.65rem);line-height:1.25;text-align:center;color:#fff;-webkit-text-stroke:5px var(--pc,#3d2a9c);paint-order:stroke fill;padding-inline:6px;transition:color .3s,transform .3s}
.pcard.focus .pname{color:var(--gold);transform:scale(1.06)}
.ptag{font-size:1rem;color:var(--muted);text-align:center}
.pread{position:absolute;top:8%;left:0;background:var(--gold);color:#3a2300;font-family:var(--display);font-size:.95rem;padding:2px 12px 4px;border-radius:999px;box-shadow:0 3px 0 #a86d10;z-index:3}
.garrow{position:absolute;top:50%;translate:0 -50%;z-index:3;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25);display:grid;place-items:center;backdrop-filter:blur(4px);transition:background .2s,transform .2s}
.garrow:hover{background:rgba(255,255,255,.22);transform:scale(1.1)}
.garrow.l{left:max(12px,2vw)}.garrow.r{right:max(12px,2vw)}
.g-foot{position:relative;z-index:2;text-align:center;padding:0 16px max(18px,3vh);color:var(--muted);font-size:1rem}
.g-foot b{color:var(--gold);font-weight:800}
.planet-svg{width:100%;height:auto;overflow:visible;display:block}
.spin{animation:spinx linear infinite}
.moonlet{animation:bob 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.ufo{position:absolute;top:24%;left:0;width:92px;z-index:1;pointer-events:none;animation:ufo 24s linear infinite 3s;transform:translateX(-140px)}
.ufo svg{width:100%;height:auto;display:block;animation:ufoWob 1.6s ease-in-out infinite}
.ufo .ul{animation:bulb .6s steps(2) infinite}
.ufo .ul:nth-of-type(2n){animation-delay:-.3s}
.comet{position:absolute;top:62%;left:0;width:120px;z-index:1;pointer-events:none;animation:comet 17s linear infinite 9s;transform:translateX(calc(100vw + 160px))}

/* ---------- 3. Planet intro ---------- */
#intro{overflow:hidden}
.space{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#1b1450 0,#07061a 70%)}
.speed{position:absolute;inset:-30%;opacity:0;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,rgba(255,255,255,0) 0 3deg,rgba(255,255,255,.6) 3deg 3.35deg,rgba(255,255,255,0) 3.35deg 9deg);
  -webkit-mask:radial-gradient(circle,transparent 0,transparent 16%,#000 55%);mask:radial-gradient(circle,transparent 0,transparent 16%,#000 55%);
  animation:jitter .09s steps(2) infinite}
.ip-wrap{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.intro-planet{position:relative;z-index:2;width:min(60vw,44vh);transform:scale(0)}
.tunnel{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.puff{position:absolute;left:50%;top:50%;width:46vmin;height:30vmin;margin:-15vmin 0 0 -23vmin;border-radius:50%;opacity:0;
  background:radial-gradient(ellipse at 50% 55%,#fff 0,rgba(255,255,255,.95) 40%,rgba(255,255,255,0) 70%)}
.ribbon-wrap{position:absolute;left:0;right:0;top:max(7vh,20px);z-index:4;display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 16px;pointer-events:none}
.ribbon{position:relative;opacity:0}
.ribbon .tail{position:absolute;top:26%;width:2.2em;height:78%;background:var(--c3);border:5px solid #2b1d52;font-size:clamp(1.4rem,4vw,2.4rem)}
.ribbon .tail.a{right:-1.5em;clip-path:polygon(0 0,100% 0,72% 50%,100% 100%,0 100%)}
.ribbon .tail.b{left:-1.5em;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,28% 50%)}
.banner{position:relative;background:var(--c2);border:5px solid #2b1d52;border-radius:22px;padding:0 .7em .15em;box-shadow:0 8px 0 rgba(0,0,0,.28),inset 0 -8px 0 rgba(0,0,0,.12)}
.intro-title{margin:0;font-family:var(--display);font-weight:400;text-align:center;font-size:clamp(2.1rem,7vw,4.6rem);line-height:1.25;color:#fff}
.intro-title .w{display:inline-block;margin:0 .1em;-webkit-text-stroke:.14em #2b1d52;paint-order:stroke fill;text-shadow:0 .07em 0 rgba(0,0,0,.3);opacity:0}
.intro-title .w:nth-child(2n){color:var(--gold)}
.intro-title .w.wave{animation:wave 1.6s ease-in-out infinite;animation-delay:calc(var(--i) * -.22s)}
.intro-sub{margin:0;font-family:var(--display);font-size:clamp(1.1rem,2.6vw,1.45rem);background:#fff;color:#2b1d52;padding:.15em 1.1em .35em;border-radius:999px;border:4px solid #2b1d52;box-shadow:0 5px 0 rgba(0,0,0,.25);opacity:0}
.rocket{position:absolute;left:0;top:0;width:clamp(64px,11vmin,100px);z-index:3;pointer-events:none;opacity:0;will-change:transform}
.rocket svg{width:100%;height:auto;display:block;overflow:visible}
.flame{transform-box:view-box;transform-origin:50px 108px;animation:flame .1s ease-in-out infinite alternate}
.skip{position:absolute;left:16px;bottom:max(16px,3vh);z-index:5;font-family:var(--display);font-size:1.1rem;padding:6px 20px 9px;border-radius:999px;background:rgba(0,0,0,.3);border:2px solid rgba(255,255,255,.55)}

/* ---------- 4. Reader ---------- */
#reader{display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);--s:0}
.r-head{position:relative;z-index:2;display:flex;align-items:center;gap:12px;padding:max(12px,2vh) 16px 8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 16px 9px;border-radius:999px;background:rgba(20,14,60,.45);border:2px solid rgba(255,255,255,.5);font-family:var(--display);font-size:1.15rem;white-space:nowrap;transition:background .2s,transform .2s;backdrop-filter:blur(4px)}
.pill:hover{background:rgba(20,14,60,.6);transform:scale(1.05)}
.r-title{flex:1;min-width:0;text-align:center;font-family:var(--display);font-size:clamp(1.3rem,3vw,1.9rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;-webkit-text-stroke:6px var(--c3);paint-order:stroke fill}
.r-count{font-family:var(--display);color:#fff;white-space:nowrap;min-width:4.5em;text-align:end;font-size:1.2rem;-webkit-text-stroke:5px var(--c3);paint-order:stroke fill}
.r-main{position:relative;z-index:1;min-height:0;display:grid;place-items:center;padding:6px 16px;perspective:1800px}
.page{position:relative;width:min(620px,100%);max-height:100%;height:min(100%,540px);background:var(--paper);color:var(--ink);border-radius:18px 6px 6px 18px;
  box-shadow:-3px 3px 0 var(--paper-edge),-6px 6px 0 #f6ead0,-9px 9px 0 var(--paper-edge),0 24px 60px rgba(0,0,0,.4);transform-style:preserve-3d}
.page::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(270deg,rgba(110,70,20,.2),transparent 7%);pointer-events:none;z-index:1}
.leaf,.flip{position:absolute;inset:0;padding:clamp(18px,3.5vw,32px) clamp(22px,5vw,44px) clamp(118px,19vw,140px);overflow:auto;border-radius:inherit}
.flip{background:var(--paper);z-index:3;transform-origin:right center;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.25)}
.flip::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(60,30,10,.28),transparent 60%);pointer-events:none}
.leaf-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.leaf-mini{width:44px;flex:none;animation:floaty 4s ease-in-out infinite}
.leaf-mini svg{width:100%;height:auto;display:block;overflow:visible}
.leaf-pg{font-family:var(--display);color:var(--c3);font-size:1.35rem}
.leaf-rule{flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--paper-edge) 0 8px,transparent 8px 14px)}
.txt{margin:0;font-size:clamp(1.2rem,2.4vw,1.42rem);line-height:1.85;font-weight:600;max-width:60ch}
.wd{display:inline-block;opacity:0;animation:wordIn .6s cubic-bezier(.2,1.3,.4,1) forwards;animation-delay:calc(var(--i) * 30ms + var(--d0,120ms))}
.wd.big{font-family:var(--display);font-weight:400;font-size:1.7em;line-height:1;color:var(--c2);-webkit-text-stroke:4px var(--c3);paint-order:stroke fill;vertical-align:-.1em}
.static .wd{animation:none;opacity:1}
.the-end{margin:12px 0 2px;font-family:var(--display);font-size:clamp(2rem,4.5vw,2.8rem);color:var(--c2);-webkit-text-stroke:6px var(--c3);paint-order:stroke fill;text-align:center;animation:endPop .9s cubic-bezier(.2,1.6,.4,1) both;animation-delay:calc(var(--n) * 30ms + 300ms)}
.end-hint{margin:0;text-align:center;color:#6b5a93;font-size:1.08rem;font-weight:600;animation:fadeUp .6s ease both;animation-delay:calc(var(--n) * 30ms + 800ms)}
.static .the-end,.static .end-hint{animation:none}
.bunny-slot{position:absolute;z-index:5;left:clamp(8px,3vw,26px);bottom:-10px;width:min(270px,56%);cursor:pointer}
.bunny{width:100%;height:auto;display:block;overflow:visible}
.bunny .fur{fill:#fffaff;stroke:#3a2a5a;stroke-width:3.5;stroke-linejoin:round}
.bunny *{transform-box:view-box}
.b-breathe{transform-origin:140px 142px;animation:breathe calc(2.4s + var(--s) * 2.6s) ease-in-out infinite}
.b-tail{transform-origin:56px 110px;animation:tail 1.3s ease-in-out infinite}
.b-head{transform-origin:200px 128px;transform:rotate(calc(var(--s) * 12deg)) translateY(calc(var(--s) * 5px));transition:transform 1.4s cubic-bezier(.4,0,.2,1)}
.b-ear1{transform-origin:180px 58px;transform:rotate(calc(-8deg - var(--s) * 72deg));transition:transform 1.4s cubic-bezier(.3,1.3,.5,1)}
.b-ear2{transform-origin:204px 56px;transform:rotate(calc(10deg - var(--s) * 88deg));transition:transform 1.4s cubic-bezier(.3,1.3,.5,1) .08s}
.b-ein1{transform-origin:180px 58px;animation:earTw 5.5s ease-in-out infinite}
.b-ein2{transform-origin:204px 56px;animation:earTw 5.5s ease-in-out infinite -2.7s}
.b-nose{transform-origin:200px 97px;animation:nose 2.4s ease-in-out infinite}
.b-open{transform-origin:200px 86px;transform:scaleY(calc(1 - var(--s) * .72));transition:transform 1.2s}
.b-blink{transform-origin:200px 86px;animation:blink 4.2s infinite}
.b-look{transition:transform .45s cubic-bezier(.3,1.4,.5,1)}
.b-shut{opacity:0}
.b-paw{transform-origin:204px 132px}
.pawwave .b-paw{animation:paw 1.6s ease-in-out}
.b-blanket{transform:translateX(calc((1 - var(--s)) * -230px));opacity:calc(var(--s) * 1.8 - .3);transition:transform 1.6s cubic-bezier(.4,0,.2,1),opacity 1.2s}
.b-cap{transform:translateY(calc((1 - var(--s)) * -40px)) rotate(calc((1 - var(--s)) * -20deg));transform-origin:200px 60px;opacity:calc((var(--s) - .45) * 3);transition:transform 1.4s cubic-bezier(.3,1.4,.5,1),opacity 1s}
.b-yawn{transform-origin:200px 104px;transform:scale(0)}
.yawn .b-yawn{animation:yawn 1.7s ease-in-out}
.yawn .b-mouth{animation:hide 1.7s}
.asleep .b-open{opacity:0}
.asleep .b-shut{opacity:1}
.asleep .b-tail,.asleep .b-ein1,.asleep .b-ein2,.asleep .b-nose{animation:none}
.asleep .bunny{animation:dreamglow 2.6s ease-in-out infinite}
.wiggle .bunny{animation:wiggle .5s ease-in-out}
.zzz{position:absolute;left:62%;bottom:88%;pointer-events:none;font-family:var(--display);color:#fff;-webkit-text-stroke:4px #6f5de8;paint-order:stroke fill;direction:ltr}
.zzz span{position:absolute;opacity:0;font-size:1.6rem}
.zzz[data-l="1"] span:nth-child(1),.zzz[data-l="2"] span:nth-child(-n+2),.zzz[data-l="3"] span{animation:zfloat 3s ease-in infinite}
.zzz span:nth-child(2){animation-delay:1s!important;font-size:2rem}
.zzz span:nth-child(3){animation-delay:2s!important;font-size:2.5rem}
.bubble{position:absolute;left:44%;bottom:100%;margin-bottom:4px;background:#fff;color:var(--ink);font-weight:700;font-size:1.05rem;padding:4px 14px 7px;border-radius:16px;white-space:nowrap;box-shadow:0 4px 0 rgba(0,0,0,.18);border:3px solid #3a2a5a;opacity:0;transform:translateY(10px) scale(.7);transform-origin:20% 100%;transition:opacity .3s,transform .4s cubic-bezier(.2,1.6,.4,1);pointer-events:none}
.bubble::after{content:"";position:absolute;left:24px;top:100%;border:9px solid transparent;border-top-color:#3a2a5a}
.bubble.show{opacity:1;transform:none}
.r-nav{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:18px;padding:10px 16px max(14px,2.5vh)}
.navb{width:58px;height:58px;border-radius:50%;background:var(--gold);color:#3a2300;display:grid;place-items:center;box-shadow:0 5px 0 #a86d10;border:3px solid #3a2300;transition:transform .15s,opacity .2s}
.navb:hover:not(:disabled){transform:scale(1.08)}
.navb:active{transform:translateY(4px);box-shadow:0 1px 0 #a86d10}
.navb:disabled{opacity:.35;cursor:default}
#next:not(:disabled){animation:nudge 2.4s ease-in-out infinite}
.dots{display:flex;gap:8px;padding:8px 12px;border-radius:999px;background:rgba(20,14,60,.4)}
.dots i{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.35);transition:background .3s,transform .4s cubic-bezier(.2,1.6,.4,1)}
.dots i.on{background:var(--gold);transform:scale(1.4)}
.dots i.done{background:rgba(255,209,102,.7)}

@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes drift{from{transform:translateX(-320px)}to{transform:translateX(var(--dw))}}
@keyframes flyx{from{transform:translateX(-200px)}to{transform:translateX(var(--dw))}}
@keyframes ffly{0%,100%{transform:translate(0,0);opacity:.25}50%{transform:translate(14px,-18px);opacity:1}}
@keyframes waveX{to{transform:translateX(-100px)}}
@keyframes flapY{to{transform:scaleY(-.5)}}

@keyframes bw{to{transform:scaleX(.25)}}
@keyframes smoke{0%{transform:translate(0,0) scale(.4);opacity:0}20%{opacity:.85}100%{transform:translate(22px,-90px) scale(1.7);opacity:0}}

  pages:[
  "بعيدًا خلف آخر مصباح في السماء، يوجد كوكب كلّه بحر. أمواجه فضّية، وأسماكه تغنّي، وفي كل مساء يصعد من الأعماق حوت كبير اسمه نور، وعلى أنفه فانوس يتوهّج.",
  "مهمّة نور مهمّة جدًّا. فهو يسبح من خليج إلى خليج، يضيء الطريق لكل سمكة صغيرة وسرطان وحصان بحر ابتعد كثيرًا عن سريره. ويدندن بهدوء: «اتبعوا الضوء… اتبعوا الضوء».",
  "وفي إحدى الأمسيات، رفض حصان بحر صغير اسمه نبنوب أن يتبع الضوء. قال وهو يدور حول نفسه: «لستُ نعسانًا! أريد أن أرى ما وراء قلعة المرجان!» فابتسم نور وقال: «تعال معي إذن، سأريك».",
  "سبحا معًا بجانب قلعة المرجان، حيث كانت نجوم البحر تتدثّر بالرمل. ومرّا فوق غابة الأعشاب، حيث كانت ثعالب الماء تمسك أيدي بعضها كي لا يطفو أحد بعيدًا في أحلامه.",
  "وعند آخر البحر، صار الماء نجومًا! شهق نبنوب؛ فقد كانت السماء كلّها منعكسة هناك، تلمع بسكون. همس نور: «هنا يبدأ الليل». فتثاءب نبنوب تثاؤبة صغيرة.",

{ title:"جبل المارشميلو", tag:"أنهار كاكاو وثلج من سكّر", colors:["#fff0f7","#ff9ccf","#b53477"], bg:"#ff5fa8", spot:"#7fe0d6", ring:"#ffe36b", moon:null, surface:"swirl", particle:"candy", spin:34, seed:22,

  pages:[
  "على كوكب وردي ناعم كالقطن، يقف جبل مصنوع من المارشميلو. أنهاره تجري بالكاكاو الدافئ، وأشجاره تنبت أوراق النعناع، وثلجه طعمه يشبه الفانيليا قليلًا.",
  "وفي أعلى القمّة تعيش الجدّة توفي، دبّة صغيرة تحمل ملعقة خشبية كبيرة. وكل ليلة تحرّك أنهار الكاكاو لتبقى دافئة لكل من يحتاج إلى مشروب لذيذ قبل النوم.",
  "لكن الليلة اختفت الملعقة! قالت الجدّة توفي: «يا إلهي! من دون ملعقتي سيبرد الكاكاو، ولن يشعر أحد على الجبل بالنعاس والدفء».",
  "بحثت أرانب الجيلي بين بساتين المصّاصات، وفتّشت فئران السكّر تحت كل حجر من الحلوى. وأخيرًا وجدت نعجة صغيرة اسمها قطنة الملعقة عالقة في كومة مارشميلو، في المكان الذي غفت فيه الجدّة بعد الظهر!",
  "ضحكت الجدّة توفي حتى اهتزّ مريولها. وحرّكت الأنهار دورةً بعد دورة، فطفت رائحة الكاكاو الدافئة فوق الجبل كلّه مثل بطانية حلوة ناعمة.",
  "شرب كل واحد كوبًا صغيرًا، ثم تدثّر في سريره من المارشميلو. صار الجبل هادئًا ومنفوشًا ودافئًا. ونامت قطنة وعلى وجهها ابتسامة بطعم الكاكاو، وما زالت تمسك طرف الملعقة."]},
{ title:"حديقة التروس", tag:"حيث تدقّ الأزهار النحاسية", colors:["#fff3b8","#e8ad3c","#6e4310"], bg:"#d0871b", spot:"#fff3b8", ring:"#9be3c3", moon:"#c9d3dd", surface:"craters", particle:"gear", spin:40, seed:33,
  hero:{k:"robot",c:["#9bd0e8","#e8f7ff"]},
  world:{sky:["#ffc46b","#fff1c9"],hills:["#e0b04c","#c48f2e","#94621e"],props:["clocktower","flower"],pc:["#ffd166","#9be3c3","#ff8fb1"],extras:[]},
  pages:[
  "هناك كوكب يدقّ: تِك، تَك. أزهاره ببتلات من نحاس، ونحلاته مصنوعة من نوابض صغيرة، وفي وسط حديقته تقف ساعة طويلة تخبر العالم كلّه متى يستيقظ ومتى ينام.",
  "يعتني بالحديقة روبوت صغير اسمه صامولة. يزيّت زهور التوليب، ويلمّع عبّاد الشمس، ويملأ الساعة الكبيرة بمفتاح بحجمه تمامًا. تِك، تَك، تِك، تَك.",
  "وفي إحدى الليالي انشغل صامولة كثيرًا حتى نسي أن يملأ الساعة. فتوقّفت عقاربها قبل موعد النوم بقليل. بقيت الأزهار النحاسية مفتوحة، وظلّ النحل يطنّ، ولم يستطع أحد أن ينام.",
  "صفّر صامولة: «يا للمشكلة!» وتسلّق برج الساعة، ترسًا بعد ترس. كانت الريح تصفر بين التروس، وذراعاه الصغيرتان متعبتان، لكنه تمسّك جيدًا وواصل التسلّق.",
  "وفي القمّة أدار صامولة المفتاح. لفّة، لفّتان، ثلاث لفّات… طَق! تحرّكت العقارب الكبيرة أخيرًا إلى موعد النوم، وأطلقت الحديقة كلّها صريرًا طويلًا ناعسًا.",
  "انطوت البتلات النحاسية، والتفّ النحل في جرار العسل. واستلقى صامولة بجانب الساعة يستمع إلى دقّاتها البطيئة الهادئة. تِك… تَك. تِك… تَك. تصبحين على خير أيّتها الحديقة."]},
{ title:"فستق والقمر المستعار", tag:"فأر وفنجان وقمر", colors:["#f1ecff","#a791f5","#3a2790"], bg:"#6a4de0", spot:"#f1ecff", ring:null, moon:"#fff4c4", surface:"craters", particle:"star", spin:30, seed:44,
  hero:{k:"mouse",c:["#cfc8e0","#ffffff"]},
  world:{sky:["#4a3ab8","#a996ff"],hills:["#7d6ad8","#5c49c0","#3f2f9a"],props:["house","pine"],pc:["#8fd4ff","#ffd6ee","#3f9a7a"],extras:[]},
  pages:[
  "كان فستق أصغر فأر على كوكب ليس له قمر أبدًا. كل ليلة كانت السماء تبقى مظلمة وفارغة، وكل ليلة كان فستق يتمنّى ضوءًا صغيرًا ينام على نوره.",
  "وفي مساءٍ ما، حزم فستق شطيرة جبن، وركب صاروخًا على شكل فنجان شاي، وطار إلى الأعلى، والأعلى، والأعلى، حتى وصل إلى كوكب جار كبير عنده ثلاثة أقمار.",
  "قال فستق للقمر الأكبر: «عفوًا، هل يمكنني أن أستعير واحدًا منكم؟ لليلة واحدة فقط، وأعدكم أن أعيده في الصباح». فضحكت الأقمار وتهامست فيما بينها.",
  "تقدّم القمر الأصغر وقال: «أنا سآتي، فطالما تمنّيت أن أرى سماءً جديدة». فربط فستق حوله شريطًا برفق شديد، وسحبه خلف فنجانه حتى البيت.",
  "في تلك الليلة، توهّج كوكب فستق بلون فضّي لأول مرة. غنّت الصراصير للقمر، ورفعت الأزهار وجوهها نحوه، وخرجت كل الفئران من جحورها لتلوّح له.",
  "تكوّر فستق في سريره المصنوع من قشرة جوزة، والقمر يلمع من نافذته. همس: «شكرًا لك». فهمس القمر: «عفوًا يا صديقي». وغرقا معًا في أنعم الأحلام."]},
{ title:"مكتبة البومة الثلجية", tag:"كتابٌ لكل حلم", colors:["#ffffff","#c4e6ff","#4a7cc4"], bg:"#3d86dc", spot:"#ffffff", ring:"#e0f4ff", moon:null, surface:"spots", particle:"snow", spin:38, seed:55,

  world:{sky:["#7fbfff","#e8f6ff"],hills:["#ffffff","#e6f3ff","#d3e8fb"],props:["crystal","books","pine"],pc:["#9fd8ff","#c4b5ff","#ffb3cf","#2f7a6a"],extras:[]},
  pages:[
  "على كوكب أبيض مثلج، تلمع كل تلّة فيه كالسكّر، توجد مكتبة مبنيّة داخل جبل جليدي. رفوفها منحوتة من الصقيع، ومصابيحها مصنوعة من ضوء النجوم المتجمّد.",
  "أمينة المكتبة بومة ثلجية عجوز اسمها السيدة سُكون. لها نظّارة مستديرة، وريشة للكتابة، وعندها كتاب لكل حلم حلم به أيّ أحد على الإطلاق.",
  "وفي ليلة مثلجة، طرق فرخ بطريق صغير اسمه بطبوط باب الجليد. قال: «يا سيدة سُكون، لا أجد حلمًا أحلم به. بحثت في كل مكان، ورأسي مشغول جدًّا».",
  "نفشت السيدة سُكون ريشها، وطارت إلى أعلى رفّ، وأنزلت كتابًا أزرق صغيرًا. قالت: «هذا الكتاب جديد تمامًا، يحكي عن بطريق تعلّم الطيران مع ندف الثلج».",
  "جلس بطبوط قرب مدفأة الصقيع، وقرأت له السيدة سُكون بأنعم صوت عندها. وفي الخارج كان الثلج يتساقط ببطء، ببطء، وكأنّ كل ندفة تهمس: هُسسس.",
  "وقبل الصفحة الأخيرة، كان بطبوط قد نام بعمق، يطير في حلمه الخاص مع ندف الثلج. فغطّته السيدة سُكون ببطانية، وأغلقت الكتاب من دون أيّ صوت."]},
{ title:"سفينة القبطان كعكة", tag:"إبحار في سماء المساء", colors:["#fff6da","#86d6ff","#2a6bd4"], bg:"#3eaaf5", spot:"#ffffff", ring:null, moon:"#ffd66b", surface:"clouds", particle:"cloud", spin:24, seed:66,
  hero:{k:"hedgehog",c:["#f3d6a8","#fff4e0"]},
  world:{sky:["#58bdfb","#e4f6ff"],hills:["#ffffff","#eaf6ff","#8fd47a"],props:["cloudprop","tree"],pc:["#7fd47a","#ffd166","#ff8fb1"],extras:["balloons"]},
  pages:[
  "عاليًا فوق كوكب من الجزر الطائرة، تبحر سفينة مصنوعة من الغيوم. أشرعتها منفوشة، ومرساتها قوس قزح، وقبطانها قنفذ مستدير مرح اسمه القبطان كعكة.",
  "للقبطان كعكة وبحّارته من العصافير مهمّة خاصّة: في كل مساء يبحرون عبر السماء ليجمعوا آخر أشعّة الشمس الدافئة، ويحفظوها في برطمانات للّيالي الباردة.",
  "الليلة هبّت ريح قويّة: ووووش! دارت سفينة الغيوم وتمايلت، وتدحرجت برطمانات الشمس على السطح. صاح القبطان: «تمسّكوا بقبّعاتكم!»",
  "فردت عصفورة صغيرة اسمها نقطة جناحيها على اتّساعهما، وأمسكت الريح كأنّها طائرة ورقية. شدّت الحبل، وأدارت الدفّة، وقادت السفينة بأمان إلى غيمة هادئة دافئة.",
  "هتف القبطان كعكة: «ثلاث هتافات لنقطة!» وفتح البحّارة برطمانًا واحدًا من أشعّة الشمس، فملأ نوره الذهبي السفينة. وجلس الجميع متقاربين، دافئين وفخورين.",
  "ولمّا ظهرت النجوم، صارت سفينة الغيوم تتهادى كالمهد. دسّت نقطة رأسها تحت جناحها، وتكوّر القبطان كرةً شائكة صغيرة، وأبحر الطاقم كلّه بهدوء إلى النوم."]},

  pages:[
  "على كوكب برتقالي دافئ مليء بالبراكين النائمة، يعيش تنّين اسمه لهيب. معظم التنانين تجمع الذهب، أمّا لهيب فيجمع شيئًا أندر بكثير: إنّه يجمع الهدوء.",
  "يحفظه في قوارير زجاجية: همسة الثلج وهو يتساقط، والسكتة بعد التهويدة، وصمت قطّة صغيرة نائمة. وكل قارورة تتوهّج بلون ناعم مختلف على رفوفه.",
  "وفي ليلة، مرّت عاصفة صاخبة فوق الكوكب. دوّى الرعد، وفرقع البرق، واختبأت كل سحالي الحمم الصغيرة تحت صخورها، خائفة لا تستطيع أن تغمض عيونها.",
  "عرف لهيب ما يجب فعله. طار من صخرة إلى صخرة يفتح قواريره واحدة بعد أخرى. فانساب هدوء الثلج المتساقط، وطفت سكينة التهويدة فوق التلال.",
  "وشيئًا فشيئًا، بدا الرعد أبعد فأبعد. أطلّت السحالي من مخابئها، ثم تثاءبت، ثم لفّت ذيولها حول أنوفها وأغمضت عيونها.",
  "كان لهيب قد استعمل كل قواريره تقريبًا، لكنّه لم يحزن. استلقى بجانب بركان دافئ، وأصغى إلى الهدوء الجديد الذي صنعه بنفسه. كان أجمل هدوء على الإطلاق. تصبح على خير يا لهيب."]},
{ title:"موكب اليراعات", tag:"ضوءٌ صغير واحد", colors:["#dcff9e","#48c46d","#0e4a38"], bg:"#16875a", spot:"#1e6b44", ring:null, moon:null, surface:"forest", particle:"firefly", spin:36, seed:88,

  pages:[
  "في أعماق كوكب تغطّيه غابات تهمس، هناك ليلة واحدة كل عام تقيم فيها اليراعات موكبًا كبيرًا. تضيء الأشجار والأنهار والسماء، كلّها في وقت واحد.",
  "كانت لمعة أصغر يراعة على الإطلاق، وهذا أوّل موكب لها. لكن كانت هناك مشكلة واحدة: ضوؤها لا يشتعل! رمشت وتمايلت وحاولت، لكن لم يحدث شيء.",
  "جلست لمعة وحيدة على فطر وتنهّدت: «ربّما أنا صغيرة جدًّا». فقفز إليها ضفدع عجوز حكيم ونقنق: «الأضواء لا تشتعل بالمحاولة الشديدة، بل تشتعل حين تشعرين بالسعادة في داخلك».",
  "ففكّرت لمعة في أشياء سعيدة: رائحة المطر، وعناق أمّها، والرقص مع صديقاتها في أمسيات الصيف الدافئة. وفي أعماقها، بدأ شيء صغير يتوهّج.",
  "ومض، ومض، ولمع! انطلقت لمعة إلى السماء وانضمّت إلى الموكب. دارت اليراعات في دوائر، ورسمت نجومًا وقلوبًا، وابتسامة كبيرة جدًّا في قلب الظلام.",
  "ولمّا انتهى الموكب، استقرّت اليراعات بين العشب الطويل كفوانيس صغيرة متعبة. خفت ضوء لمعة حتى صار أنعم وهج. ونامت سعيدة تحت نجوم الغابة."]},
{ title:"مدينة البالونات", tag:"بيوت تطير مع النسيم", colors:["#fff0fa","#ffa6d2","#7a4fd0"], bg:"#ff7cc0", spot:"#7fd4ff", ring:"#7fd4ff", moon:null, surface:"spots", particle:"balloon", spin:30, seed:99,

  pages:[
  "في السماء الورديّة يطفو كوكب صغير اسمه مدينة البالونات. بيوته مربوطة ببالونات ملوّنة، وشوارعه تتمايل مع النسيم، وكل مساء يغنّي الهواء أغنية ناعمة.",
  "تعيش هناك قطّة صغيرة اسمها ميشو. كانت تحبّ البالونات أكثر من أيّ شيء، وتحلم أن تطير عاليًا، أعلى من كل البيوت، لتلمس غيمة بيدها.",
  "في ذلك المساء، أمسكت ميشو خيوط خمسة بالونات، ويا للعجب! ارتفعت قدماها عن الأرض. صاحت وهي تضحك: «أنا أطير!» والبيوت تصغر تحتها شيئًا فشيئًا.",
  "لمست ميشو غيمة طريّة، فكانت باردة وناعمة كالآيس كريم. ثم رأت الشمس تغيب، والنجوم تفتح عيونها واحدة بعد أخرى، ففكّرت: «أين بيتي؟»",
  "ومن بعيد رأت نافذة بيتها مضيئة، وأمّها تلوّح لها. فأطلقت ميشو بالونًا بعد بالون، ونزلت ببطء… ببطء… مثل ريشة ترقص في الهواء.",
  "هبطت ميشو في حضن أمّها تمامًا. شربت حليبها الدافئ، وربطت بالوناتها بجانب سريرها. ثم أغمضت عينيها، وطارت في أحلامها فوق غيوم من آيس كريم."]},
{ title:"السلحفاة وقطار النجوم", tag:"رحلة حول القمر", colors:["#dfe6ff","#6f86ff","#1f2a7a"], bg:"#4a5de0", spot:"#dfe6ff", ring:"#ffd166", moon:"#fff4c4", surface:"craters", particle:"star", spin:34, seed:110,

  pages:[
  "على كوكب أزرق هادئ، يمرّ كل ليلة قطار مصنوع من النجوم. عرباته تلمع، وصافرته تغنّي: «توووت»، ويأخذ الحيوانات في رحلة قصيرة حول القمر قبل النوم.",
  "سنسن سلحفاة صغيرة بطيئة جدًّا. كل ليلة كانت تمشي نحو المحطّة خطوة… خطوة… خطوة، لكنّها تصل دائمًا بعد أن يرحل القطار.",
  "الليلة جلست سنسن حزينة على رصيف المحطّة. نزلت دمعة صغيرة على خدّها، وقالت بصوت خافت: «لن أركب قطار النجوم أبدًا».",
  "لكنّ السائق، وهو نجم عجوز له لحية من ضوء، لاحظ السلحفاة الصغيرة. فأوقف القطار، ورجع به إلى الخلف ببطء، حتى توقّف أمامها تمامًا.",
  "قال لها مبتسمًا: «القطار لا يرحل من دون أصدقائه». فصعدت سنسن، وجلست بجانب النافذة، ودار القطار بها حول القمر، والنجوم تلوّح لها.",
  "وحين عادت إلى البيت، كانت عيناها ثقيلتين من السعادة. سحبت رأسها داخل صدفتها الدافئة، ونامت، تسمع صافرة القطار البعيدة: توووت… توووت."]},

  world:{sky:["#43247e","#a47de2"],hills:["#6b45b3","#522f95","#381f70"],props:["mushroom"],pc:["#7fffe0","#ff8fe0","#8fb5ff","#ffe36b"],extras:[]},
  pages:[
  "في كوكب بنفسجي، يوجد بستان فيه فطر كبير يضيء في الليل مثل المصابيح. أزرق وأخضر ووردي، يتوهّج كلّما همس له أحد بكلمة لطيفة.",
  "الحلزونة لولبة تحمل بيتها على ظهرها، وتتنزّه بين الفطر كل مساء. لكنّها الليلة ابتعدت كثيرًا، ولم تعد تعرف طريق الرجوع.",
  "كان البستان مظلمًا، والفطر نائمًا لا يضيء. ارتجف قرنا لولبة الصغيران، وقالت بصوت خافت: «أنا خائفة قليلًا».",
  "ثم تذكّرت سرّ البستان. فاقتربت من فطرة صغيرة وهمست: «أنتِ جميلة». فتوهّجت الفطرة بلون أزرق ناعم! ثم همست للفطرة التالية: «شكرًا لكِ».",
  "وهكذا، كلمة لطيفة بعد كلمة لطيفة، صار أمامها طريق من الأضواء الملوّنة يلمع حتى باب بيتها. ضحكت لولبة: «الكلمات الطيّبة تنير الطريق!»",
  "وصلت لولبة إلى بيتها، ودخلت صدفتها المستديرة، وتمنّت للفطر ليلة سعيدة. فأضاء البستان كلّه مرّة أخيرة، ثم خفت بهدوء، ونامت لولبة مبتسمة."]},

  world:{sky:["#ffc23d","#fff2bf"],hills:["#f2d56a","#dfb23c","#b3861b"],props:["flower","tree"],pc:["#ff8fb1","#ffffff","#b18cff","#6fcf5a"],extras:["bees"]},
  pages:[
  "على كوكب ذهبي مليء بالأزهار، يُقام كل عام مهرجان العسل. تطير النحلات في رقصات جميلة، وتصنع أحلى عسل في المجرّة كلّها.",
  "دبدوب دبّ صغير يحبّ العسل كثيرًا. لكنّه هذا العام أراد شيئًا مختلفًا: أراد أن يساعد النحلات، بدلًا من أن يأكل فقط.",
  "فحمل دبدوب إبريقًا صغيرًا، وسقى الأزهار واحدة واحدة، حتى تعبت ذراعاه. وقالت الأزهار: «شكرًا يا دبدوب!» وفتحت بتلاتها على اتّساعها.",
  "فرحت النحلات بالأزهار الكثيرة، وصنعت عسلًا أكثر من أيّ عام مضى. ثم طارت حول دبدوب ترقص وتطنّ: «بزززز! أنت بطل المهرجان!»",
  "وفي المساء، أهدته الملكة نحلة جرّة صغيرة من العسل الذهبي، مكتوب عليها: «إلى صديقنا المساعد». فاحمرّ خدّا دبدوب من الفرح.",
  "أكل دبدوب ملعقة واحدة فقط، وحفظ الباقي لأصدقائه. ثم تكوّر تحت شجرة كبيرة، والنحلات تطنّ حوله تهويدة ناعمة: بزز… بزز… حتى نام."]},
{ title:"أوركسترا الضفادع", tag:"موسيقى فوق البحيرة", colors:["#d8ffe0","#4fd18b","#0f5a4a"], bg:"#1fa877", spot:"#ffffff", ring:"#bff5ff", moon:null, surface:"waves", particle:"note", spin:28, seed:143,
  hero:{k:"frog",c:["#6fcf5a","#e6ffc4"]},
  world:{sky:["#3fb3a6","#c9f5e4"],hills:["#79d69c","#3fb8d0","#2f9a64"],water:true,props:["flower","mushroom"],pc:["#ff9fd0","#ffffff","#ffd166"],extras:[]},
  pages:[
  "على كوكب أخضر فيه بحيرة لامعة، تعيش أوركسترا من الضفادع. كل ليلة تجلس على أوراق اللوتس، وتعزف موسيقى تساعد الكوكب كلّه على النوم.",
  "قائد الأوركسترا ضفدع صغير اسمه نقنوق، يحمل عصا رفيعة من القصب. يرفعها فيبدأ العزف: نق، نق، نق… ويخفضها فيهدأ كل شيء.",
  "لكن الليلة جاء إلى البحيرة صرصور صغير يعزف لحنًا سريعًا وعاليًا: تِرِررر! فاختلط اللحنان، وضحك السمك، ولم يستطع أحد أن ينام.",
  "لم يغضب نقنوق، بل قال للصرصور: «لحنك جميل! ما رأيك أن تعزفه معنا… ببطء؟» ففكّر الصرصور قليلًا، ثم هزّ رأسه موافقًا.",
  "رفع نقنوق عصاه، وعزفت الضفادع، وعزف الصرصور معها ببطء: نق… تِر… نق… تِر. فصار اللحن أجمل لحن سمعته البحيرة على الإطلاق.",
  "تثاءب السمك، وأغمضت زهور اللوتس بتلاتها، وأطفأت اليراعات أضواءها. ووضع نقنوق عصاه جانبًا، ونام على ورقة لوتس تتهادى فوق الماء."]},
{ title:"قلعة الرمال الذهبية", tag:"غرفة صغيرة للريح", colors:["#fff0c4","#ffb24d","#8a3f12"], bg:"#f07f2a", spot:"#fff0c4", ring:null, moon:"#ffe9c4", surface:"lava", particle:"star", spin:38, seed:154,

  world:{sky:["#ff8f4f","#ffe2ac"],hills:["#f7c984","#e8a95a","#cf8a40"],props:["castle","cactus"],pc:["#4fae5a","#ffd166"],extras:[]},
  pages:[
  "على كوكب من الرمال الذهبية، حيث تلمع الكثبان كالعسل، يعيش ثعلب صغير اسمه فرفور. أذناه كبيرتان، وذيله منفوش، ويحبّ البناء أكثر من أيّ شيء.",
  "في كل مساء، يبني فرفور قلعة من الرمال: أبراج عالية، وأبواب صغيرة، ونوافذ مزيّنة بالأصداف. لكنّ الريح كانت تأتي وتهدمها كل ليلة.",
  "الليلة جلس فرفور قرب قلعته الجديدة ينتظر. وحين هبّت الريح، قال لها بلطف: «أيّتها الريح، لماذا تهدمين قلاعي؟»",
  "توقّفت الريح وقالت بصوت ناعم: «أنا لا أقصد! أنا فقط أبحث عن مكان أرتاح فيه، فأنا أركض طوال اليوم ولا أنام أبدًا».",
  "ففكّر فرفور، ثم بنى في قلعته غرفة كبيرة، لها نافذة واسعة، ووسادة من الرمل الناعم. وقال: «هذه غرفتكِ يا ريح». فدخلت الريح، وتنهّدت بارتياح.",
  "في تلك الليلة لم تُهدم القلعة. كانت الريح نائمة في غرفتها، تشخر بهدوء: فووو… فووو. وتكوّر فرفور بجانب القلعة، ولفّ ذيله حوله كبطانية، ونام."]},
{ title:"البطريق وأضواء الشفق", tag:"سماء ترقص بالألوان", colors:["#e8fbff","#8fe3ff","#1a3f8a"], bg:"#2a6fd0", spot:"#ffffff", ring:"#9dffcf", moon:null, surface:"spots", particle:"snow", spin:36, seed:165,

  world:{sky:["#0e1846","#35559f"],hills:["#eef6ff","#d6e8fb","#bcd7f5"],aurora:true,props:["crystal","pine"],pc:["#9fe8ff","#2f7a6a","#d9c8ff"],extras:[]},
  pages:[
  "في أقصى كوكب جليدي، حيث الليل طويل والثلج يلمع، تظهر أحيانًا أضواء راقصة في السماء: خضراء وورديّة وبنفسجية. اسمها أضواء الشفق.",
  "البطريق الصغير زلّوج لم يرَ الشفق أبدًا. فكلّما ظهر، كان قد نام قبله. وكان يسأل أمّه كل صباح: «هل جاءت الأضواء؟ لماذا لم توقظيني؟»",
  "الليلة قرّر زلّوج أن يبقى مستيقظًا. جلس على صخرة جليدية، ولفّ حول رقبته وشاحًا أحمر، وحدّق في السماء المظلمة. انتظر… وانتظر… وانتظر.",
  "وفجأة! رقص خيط أخضر في السماء، ثم خيط وردي، ثم صارت السماء كلّها ستارة من الألوان تتموّج. فتح زلّوج منقاره من الدهشة: «يااه!»",
  "ورقصت الأضواء كأنّها تحيّيه، ونزلت ندف الثلج تلمع بألوانها. فرفرف زلّوج بجناحيه الصغيرين ورقص معها على الجليد، وهو يضحك.",
  "ثم عاد إلى أمّه وتكوّر تحت دفئها. همس: «رأيتها يا أمّي، كانت أجمل من الأحلام». فقالت أمّه: «والآن حان وقت الأحلام». وأغمض زلّوج عينيه."]},

function surface(p){
  const r = rng(p.seed), R = (a,b)=>a+r()*(b-a);
  const [c1,,c3] = p.colors; let s = '';
  switch(p.surface){
    case 'waves':
      for(let i=0;i<8;i++){const y=-70+i*19;let d=`M-80 ${y}`;for(let k=0;k<8;k++)d+=` q10 ${k%2?6:-6} 20 0`;
        s+=`<path d="${d}" fill="none" stroke="${i%2?'#fff':c1}" stroke-width="${i%2?3:6}" stroke-linecap="round" opacity="${i%2?.35:.5}"/>`;}
      break;
    case 'swirl':
      for(let x=-80;x<80;x+=32) s+=`<polygon points="${x},-90 ${x+14},-90 ${x-26},90 ${x-40},90" fill="#fff" opacity=".42"/>`;
      for(let i=0;i<12;i++) s+=`<rect x="${R(-80,80)}" y="${R(-70,70)}" width="7" height="2.6" rx="1.3" fill="${['#7fe0d6','#ffe36b','#fff','#8a6cf0'][i%4]}" transform="rotate(${R(0,180)})"/>`;
      break;
    case 'craters':
      for(let i=0;i<10;i++){const x=R(-80,80),y=R(-66,66),cr=R(6,16);
        s+=`<circle cx="${x}" cy="${y}" r="${cr}" fill="${c3}" opacity=".3"/><circle cx="${x+cr*.18}" cy="${y+cr*.18}" r="${cr*.72}" fill="${c1}" opacity=".22"/>`;}
      break;
    case 'spots':
      for(let i=0;i<11;i++) s+=`<ellipse cx="${R(-80,80)}" cy="${R(-70,70)}" rx="${R(8,22)}" ry="${R(5,11)}" fill="${p.spot}" opacity=".75"/>`;
      break;
    case 'clouds':
      for(let i=0;i<8;i++){const x=R(-80,80),y=R(-62,62),k=R(.7,1.2);
        s+=`<g fill="#fff" opacity=".85"><circle cx="${x}" cy="${y}" r="${9*k}"/><circle cx="${x+10*k}" cy="${y-5*k}" r="${11*k}"/><circle cx="${x+21*k}" cy="${y}" r="${8*k}"/></g>`;}
      break;
    case 'lava':
      for(let i=0;i<7;i++){const y=-66+i*22+R(-4,4);let pts=`-80,${y.toFixed(1)}`;
        for(let x=-64;x<80;x+=16)pts+=` ${x},${(y+R(-6,6)).toFixed(1)}`;pts+=` 80,${y.toFixed(1)}`;
        s+=`<polyline points="${pts}" fill="none" stroke="${p.spot}" stroke-width="${R(2,4)}" stroke-linejoin="round" opacity=".75"/>`;}
      for(let i=0;i<6;i++) s+=`<circle cx="${R(-80,80)}" cy="${R(-66,66)}" r="${R(4,8)}" fill="#ffe9a8" opacity=".6"/>`;
      break;
    case 'forest':
      for(let i=0;i<12;i++) s+=`<ellipse cx="${R(-80,80)}" cy="${R(-70,70)}" rx="${R(10,22)}" ry="${R(6,12)}" fill="${p.spot}" opacity=".8"/>`;
      for(let i=0;i<16;i++) s+=`<circle cx="${R(-80,80)}" cy="${R(-70,70)}" r="1.8" fill="#f6ff8a"/>`;
      break;
    case 'rainbow':
      ['#ff5b6b','#ffa94d','#ffe36b','#6fcf5a','#5ab0ff','#9b7bff'].forEach((c,i)=>{ s+=`<rect x="-80" y="${-70+i*24}" width="160" height="14" rx="7" fill="${c}" opacity=".7"/>`; });
      break;
  }
  return s;
}

/* =========================================================

   ========================================================= */
let worldSt=null;
function buildWorld(st, enterDelay=null){

  const w=st.world, r=rng(st.seed*7+3), R=(a,b)=>a+r()*(b-a), pick=a=>a[Math.floor(r()*a.length)], pc=w.pc;

  const wave=(base,a)=>{ let d=`M-100 ${base}`; for(let x=-100;x<W+200;x+=50) d+=` q25 ${-a} 50 0`; return d+` L${W+200} ${H+40} L-100 ${H+40}Z`; };
  let s=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMax slice"><defs>

const TT={c:$('#fxTitle'),ps:[],t:0,phase:null,done:null};
TT.start=async function(){
  try{ await Promise.race([document.fonts.load('100px Lalezar'), new Promise(r=>setTimeout(r,1500))]); }catch(e){}
  sizeCanvas(this.c); const W=this.c.width,H=this.c.height;
  const off=document.createElement('canvas'); off.width=W; off.height=H; const o=off.getContext('2d');
  const fs=Math.min(W*.14,H*.17);
  o.font=`${fs}px Lalezar, Tahoma, sans-serif`; o.direction='rtl'; o.textAlign='center'; o.textBaseline='middle'; o.fillStyle='#fff';
  o.fillText('حكايات قبل النوم', W/2, H*.44);
  const d=o.getImageData(0,0,W,H).data, step=Math.max(3,Math.round(fs/26)); const pts=[];
  for(let y=0;y<H;y+=step) for(let x=0;x<W;x+=step) if(d[(y*W+x)*4+3]>140) pts.push([x,y]);
  for(let i=pts.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[pts[i],pts[j]]=[pts[j],pts[i]];}
  this.ps=pts.slice(0,1700).map(([tx,ty])=>{const a=rand(0,6.283),R=Math.max(W,H)*rand(.55,.95); return {tx,ty,sx:W/2+Math.cos(a)*R,sy:H/2+Math.sin(a)*R,dl:rand(0,.8),r:rand(1,2.2)*DPR,col:GOLD[(Math.random()*4)|0],ph:rand(0,6.3)};});
  this.t=0; this.phase=reduce?'hold':'form'; this.t2=0;
  return new Promise(res=>this.done=res);
};
TT.go=function(){ if(this.phase!=='form'&&this.phase!=='hold') return; this.phase='go'; this.t=0; };
TT.step=function(dt){
  if(!this.phase) return;
  const ctx=this.c.getContext('2d'), W=this.c.width,H=this.c.height; this.t+=dt; const t=this.t;
  ctx.clearRect(0,0,W,H); ctx.globalCompositeOperation='lighter';

const rk={el:$('#rocket'),mode:null,t:0,x:0,y:0,s:1,ang:0};
function rocketStep(dt){
  if(!rk.mode) return;
  rk.t+=dt;
  const [pcx,pcy]=centerOf($('#introPlanet')), W=innerWidth, H=innerHeight;
  let x,y,s,ang;
  if(rk.mode==='approach'){
    const k=Math.min(1,rk.t/1.1), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    const P0=[W*.12,H*1.15],P1=[W*.95,H*.5],P2=[pcx,pcy];
    x=(1-e)*(1-e)*P0[0]+2*(1-e)*e*P1[0]+e*e*P2[0];
    y=(1-e)*(1-e)*P0[1]+2*(1-e)*e*P1[1]+e*e*P2[1];
    const dx=2*(1-e)*(P1[0]-P0[0])+2*e*(P2[0]-P1[0]), dy=2*(1-e)*(P1[1]-P0[1])+2*e*(P2[1]-P1[1]);
    s=2*(1-e)+.35*e; ang=Math.atan2(dx,-dy);
  } else {
    const k=Math.min(1,rk.t/.45);
    x=rk.x0+(pcx-rk.x0)*k; y=rk.y0+(pcy-rk.y0)*k; s=rk.s0*(1-k); ang=rk.ang+k*6;
    if(k>=1){ rk.mode=null; rk.el.style.opacity=0; }
  }
  rk.x=x; rk.y=y; rk.s=s; rk.ang=ang;
  rk.el.style.transform=`translate(${x}px,${y}px) translate(-50%,-50%) rotate(${ang}rad) scale(${s})`;
  if(rk.mode && !reduce){
    const L=rk.el.offsetWidth*.62*s;
    for(let i=0;i<2;i++){ const p=fxIntro.make('trail',(x-Math.sin(ang)*L)*DPR+rand(-3,3),(y+Math.cos(ang)*L)*DPR+rand(-3,3),-Math.sin(ang)*60*DPR,Math.cos(ang)*60*DPR,Math.max(.5,s)); p.max=rand(.4,.7); fxIntro.ps.push(p); }
  }
}

  if(!built){
    strip.innerHTML = STORIES.map((s,i)=>`<button class="pcard" data-i="${i}" style="--pc:${s.colors[2]}" aria-label="${s.title}: ${s.tag}">
      <span class="pinner"><span class="pwrap"><span class="phero"><svg viewBox="0 0 120 120" aria-hidden="true">${heroSVG(s.hero)}</svg></span><span class="pplanet">${planetSVG(s,'g'+i)}</span><span class="pread" hidden>قُرئت</span></span>
      <span class="pname">${s.title}</span><span class="ptag">${s.tag}</span></span></button>`).join('');
    built=true;
  }
  strip.querySelectorAll('.pcard').forEach((c,i)=>c.querySelector('.pread').hidden=!readSet.has(i));
  $('#gfoot').innerHTML = readSet.size ? `زرتَ <b>${ar(readSet.size)}</b> من ${ar(STORIES.length)} كوكبًا` : `${ar(STORIES.length)} كوكبًا تنتظرك الليلة`;
  requestAnimationFrame(updateStrip);
}
function galaxyEnter(){
  titleWords.forEach((w,k)=>{ w.classList.remove('wave'); const a=w.animate([{opacity:0,transform:'translateY(-90px) scale(.3) rotate(-14deg)'},{opacity:1,transform:'translateY(10px) scale(1.12) rotate(4deg)',offset:.65},{opacity:1,transform:'none'}],{duration:dur(800),delay:dur(150+k*110),easing:'ease-out',fill:'backwards'});
    a.finished.then(()=>w.classList.add('wave')).catch(()=>{}); });
  [$('#gBrand'),$('#gSub'),$('#gfoot'),$('#gl'),$('#gr')].forEach((el,k)=>el.animate([{opacity:0},{opacity:1}],{duration:dur(600),delay:dur(500+k*120),fill:'backwards'}));
  const sr=strip.getBoundingClientRect();
  strip.querySelectorAll('.pcard').forEach((c,k)=>{ const r=c.getBoundingClientRect(); if(r.right<sr.left-50||r.left>sr.right+50) return;
    c.animate([{opacity:0,transform:'translateY(-30vh) scale(0) rotate(-200deg)'},{opacity:1,transform:'translateY(4vh) scale(1.12) rotate(10deg)',offset:.65},{opacity:1,transform:'none'}],{duration:dur(1000),delay:dur(350+Math.abs(r.left+r.width/2-(sr.left+sr.width/2))/3),easing:'cubic-bezier(.2,.8,.3,1)',fill:'backwards'});
    const hr=c.querySelector('.phero'); hr.animate([{transform:'translateY(-120px) scale(.2)',opacity:0},{transform:'translateY(0) scale(1.2,.8)',opacity:1,offset:.7},{transform:'none',opacity:1}],{duration:dur(700),delay:dur(1000+k%6*80),easing:'ease-out',fill:'backwards'}); });
}
function updateStrip(){
  const sr=strip.getBoundingClientRect(), cx=sr.left+sr.width/2, W=sr.width||1;
  strip.querySelectorAll('.pcard').forEach(c=>{
    const r=c.getBoundingClientRect(), d=(r.left+r.width/2-cx)/W, ad=Math.min(Math.abs(d),1.2);
    const inner=c.firstElementChild;
    inner.style.transform=`translateY(${(d*d*140).toFixed(1)}px) scale(${(1.1-ad*.5).toFixed(3)}) rotate(${(d*8).toFixed(2)}deg)`;
    inner.style.opacity=(1-ad*.55).toFixed(2);
    c.classList.toggle('focus', Math.abs(d)<.12);
  });
}
strip.addEventListener('scroll',()=>requestAnimationFrame(updateStrip),{passive:true});
strip.addEventListener('wheel',e=>{ if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){ strip.scrollLeft-=e.deltaY; e.preventDefault(); } },{passive:false});
function nudge(dir){ const w=strip.querySelector('.pcard').offsetWidth+6; strip.scrollBy({left:dir*w,behavior:reduce?'auto':'smooth'}); }
$('#gl').onclick=()=>nudge(-1); $('#gr').onclick=()=>nudge(1);
strip.addEventListener('click',e=>{ const c=e.target.closest('.pcard'); if(c) flyTo(+c.dataset.i, c); });

/* =========================================================
   3. Planet intro: rocket → plunge → cloud tunnel → world builds
   ========================================================= */
let token=0, skipResolve=null;
function applyColors(el, st){ el.style.setProperty('--c1',st.colors[0]); el.style.setProperty('--c2',st.colors[1]); el.style.setProperty('--c3',st.colors[2]); el.style.setProperty('--bgc',st.bg); }
const tunnel=$('#tunnel');
tunnel.innerHTML=Array.from({length:18},()=>'<div class="puff"></div>').join('');
function cloudTunnel(){
  const R=Math.max(innerWidth,innerHeight);
  $$('#tunnel .puff').forEach((p,k)=>{ const a=k/18*6.283+rand(-.2,.2), r0=rand(10,60), r1=R*rand(.8,1.2);
    p.animate([{transform:`translate(${Math.cos(a)*r0}px,${Math.sin(a)*r0}px) scale(.4)`,opacity:0},{opacity:1,offset:.25},{transform:`translate(${Math.cos(a)*r1}px,${Math.sin(a)*r1}px) scale(3.4)`,opacity:0}],{duration:dur(rand(800,1200)),delay:dur(rand(0,300)),easing:'cubic-bezier(.3,0,.6,1)',fill:'backwards'}); });
}
async function flyTo(i, card){
  if(scene!=='galaxy') return;
  const st=STORIES[i], my=++token, intro=$('#intro');
  if(card){ const inn=card.firstElementChild, hr=card.querySelector('.phero');
    hr.animate([{transform:'none'},{transform:'translateY(-40px) rotate(-360deg) scale(1.2)'},{transform:'none'}],{duration:dur(500),easing:'ease-out'});
    inn.animate([{transform:inn.style.transform},{transform:'scale(1.35,1.2) translateY(-10px)',offset:.4},{transform:'scale(.1) translateY(-40vh)',opacity:0}],{duration:dur(620),easing:'cubic-bezier(.5,0,.8,.4)'});
    const [x,y]=centerOf(card); fxBook.burst('star',24,x*DPR,y*DPR,{speed:[150,500],scale:.7});
    await wait(560); }
  applyColors(intro, st); applyColors(reader, st);
  const planet=$('#introPlanet'), title=$('#introTitle'), sub=$('#introSub'), speed=$('#speed'), space=$('#space'), ribbon=$('#ribbon');
  planet.innerHTML=planetSVG(st,'in');
  const words=splitWords(title, st.title);
  sub.textContent=st.tag;
  [planet,speed,space,sub,ribbon].forEach(el=>el.getAnimations().forEach(a=>a.cancel()));
  space.style.opacity=1; planet.style.visibility='visible'; ribbon.style.opacity=0; sub.style.opacity=0;
  fxIntro.ps=[]; fxIntro.ambient=0;
  $('#world').classList.remove('on');
  rk.mode='approach'; rk.t=0; rk.el.style.opacity=1;
  show('intro', true);
  let skipped=false;
  const done = new Promise(r=>skipResolve=()=>{skipped=true;r();});
  const seq = (async()=>{
    sky.target=2.8;
    speed.animate([{opacity:0},{opacity:.85}],{duration:dur(300),fill:'forwards'});
    planet.animate([{transform:'scale(.03) rotate(-140deg)'},{transform:'scale(.8) rotate(0deg)'}],{duration:dur(1100),easing:'cubic-bezier(.3,0,.5,1)',fill:'forwards'});
    await wait(1100); if(my!==token||skipped) return;
    // plunge into the planet
    rk.x0=rk.x; rk.y0=rk.y; rk.s0=rk.s; rk.mode='dive'; rk.t=0;
    planet.animate([{transform:'scale(.8)'},{transform:'scale(.72) rotate(-8deg)',offset:.2},{transform:'scale(18) rotate(30deg)'}],{duration:dur(800),easing:'cubic-bezier(.6,0,.9,.4)',fill:'forwards'});
    speed.animate([{opacity:.85},{opacity:0}],{duration:600,fill:'forwards'});
    await wait(560); if(my!==token||skipped) return;
    await flash(st.colors[0],240,0,1); if(my!==token||skipped) return;
    // atmosphere: clouds rush past and the world builds itself
    sky.target=.02; space.style.opacity=0; planet.style.visibility='hidden'; rk.mode=null; rk.el.style.opacity=0;
    buildWorld(st, 250); $('#world').style.setProperty('--s',0); $('#world').classList.add('on');
    cloudTunnel();
    flash(st.colors[0],700,1,0);
    await wait(1250); if(my!==token||skipped) return;
    ribbon.animate([{opacity:0,transform:'translateY(-120px) scale(.3,.1) rotate(-8deg)'},{opacity:1,transform:'translateY(10px) scale(1.12,1.1) rotate(3deg)',offset:.6},{opacity:1,transform:'scale(.97) rotate(-1deg)',offset:.8},{opacity:1,transform:'none'}],{duration:dur(800),easing:'ease-out',fill:'forwards'});
    words.forEach((w,k)=>{ const a=w.animate([
      {opacity:0,transform:'translateY(50px) scale(0) rotate(-20deg)'},
      {opacity:1,transform:'translateY(-14px) scale(1.3) rotate(6deg)',offset:.55},
      {opacity:1,transform:'translateY(4px) scale(.94)',offset:.8},
      {opacity:1,transform:'none'}],{duration:dur(650),delay:dur(250+k*150),easing:'ease-out',fill:'forwards'});
      a.finished.then(()=>{ w.style.opacity=1; a.cancel(); w.classList.add('wave'); }).catch(()=>{}); });
    sub.animate([{opacity:0,transform:'translateY(20px) scale(.4)'},{opacity:1,transform:'scale(1.1)',offset:.7},{opacity:1,transform:'none'}],{duration:dur(600),delay:dur(450+words.length*150),easing:'ease-out',fill:'forwards'});
    setTimeout(()=>{ if(my!==token) return; const [x,y]=centerOf(ribbon); fxIntro.burst('confetti',80,x*DPR,y*DPR,{cols:CONFETTI,speed:[300,1000],up:200}); fxIntro.burst(st.particle,st.particle==='cloud'?16:40,x*DPR,y*DPR,{cols:particleCols(st)}); },dur(500));
    fxIntro.type=st.particle; fxIntro.cols=particleCols(st); fxIntro.ambient=4;
    await wait(3000); if(my!==token) return;
  })();
  await Promise.race([seq, done]);
  if(my!==token) return;
  skipResolve=null; fxIntro.ambient=0;
  if(skipped){
    rk.mode=null; rk.el.style.opacity=0; space.style.opacity=0; planet.style.visibility='hidden';
    buildWorld(st); $('#world').classList.add('on');
    await flash(st.colors[0],200,0,1);
  } else {
    ribbon.animate([{opacity:1,transform:'none'},{opacity:0,transform:'translateY(-160px) scale(.6) rotate(6deg)'}],{duration:dur(450),easing:'ease-in',fill:'forwards'});
    sub.animate([{opacity:1},{opacity:0,transform:'translateY(-40px)'}],{duration:dur(300),fill:'forwards'});
    await wait(380);
  }
  if(my!==token) return;
  openReader(i);
  fxIntro.ps=[];
  if(skipped) flash(st.colors[0], 700, 1, 0);
}
function skipIntro(){ if(skipResolve) skipResolve(); }
$('#skip').onclick=skipIntro;

/* =========================================================
   4. Reader
   ========================================================= */
let cur=0, pg=0, busy=false;
const reader=$('#reader'), leaf=$('#leaf'), page=$('#page'), slot=$('#bunnySlot'), bubble=$('#bubble');
const CHAT=['رائع!','وماذا حدث بعد ذلك؟','أحببتُ هذا!','أكمل، أكمل!','يا سلام!','هذا مضحك!'];
const TAPS=['هههه! هذا يُدغدغني','أحبّ الحكايات!','أكمل القراءة من فضلك','لستُ نعسانًا بعد!'];
const ACTS=['wave','jump','surprise','spin','stretch'];
function leafHTML(st,p){
  const n=st.pages.length, lastPg=p===n-1, ws=st.pages[p].split(' ');
  const txt=ws.map((w,k)=>`<span class="wd${p===0&&k===0?' big':''}" style="--i:${k}">${w}</span>`).join(' ');
  return `<div class="leaf-head"><span class="leaf-mini"><svg viewBox="0 0 120 120" aria-hidden="true">${heroSVG(st.hero)}</svg></span><span class="leaf-pg">صفحة ${ar(p+1)}</span><span class="leaf-rule"></span></div>
    <p class="txt" style="--n:${ws.length}">${txt}</p>
    ${lastPg?`<div class="the-end" style="--n:${ws.length}">النهاية</div><p class="end-hint" style="--n:${ws.length}">هُسسس… أرنوب نام بعمق. المس الأرنب النائم لتعود إلى الكواكب.</p>`:''}`;
}
function setSleep(){
  const n=STORIES[cur].pages.length, s=pg/(n-1);
  reader.style.setProperty('--s', s.toFixed(3));
  $('#world').style.setProperty('--s', s.toFixed(3));
  const asleep = pg===n-1;
  slot.classList.toggle('asleep', asleep);
  $('#zzz').dataset.l = asleep?3 : s>=.75?2 : s>=.55?1 : 0;
  slot.setAttribute('aria-label', asleep?'أرنوب نائم. المسه لتعود إلى الكواكب':'أرنوب');
  const h=heroEl(); if(h){ h.classList.toggle('sleepy', s>=.6 && !asleep); h.classList.toggle('sleep', asleep); }
}
function updateChrome(){
  const st=STORIES[cur], n=st.pages.length;
  $('#rCount').textContent=`${ar(pg+1)} / ${ar(n)}`;
  $('#prev').disabled=pg===0; $('#next').disabled=pg===n-1;
  $('#dots').innerHTML=st.pages.map((_,k)=>`<i class="${k===pg?'on':k<pg?'done':''}"></i>`).join('');
}
function say(text, ms=2600){ bubble.textContent=text; bubble.classList.remove('show'); void bubble.offsetWidth; bubble.classList.add('show'); clearTimeout(say.t); say.t=setTimeout(()=>bubble.classList.remove('show'),ms); }
function hop(big){ slot.animate([{transform:'none'},{transform:'translateY(4px) scale(1.06,.92)',offset:.2},{transform:`translateY(${big?-34:-18}px) scale(.96,1.05)`,offset:.5},{transform:'translateY(2px) scale(1.05,.95)',offset:.8},{transform:'none'}],{duration:dur(620),easing:'ease-out'}); }
function pawWave(){ slot.classList.remove('pawwave'); void slot.offsetWidth; slot.classList.add('pawwave'); setTimeout(()=>slot.classList.remove('pawwave'),1700); }
// Arnoob looks around while awake
setInterval(()=>{ if(scene!=='reader'||slot.classList.contains('asleep')) return; const s=pg/(STORIES[cur].pages.length-1);
  $('#bLook').style.transform=`translate(${rand(-3,3).toFixed(1)}px,${rand(-2,1.5).toFixed(1)}px)`;
  if(Math.random()<.18 && s<.5) pawWave(); },2200);
function openReader(i){
  cur=i; pg=0; const st=STORIES[i];
  applyColors(reader, st);
  $('#rTitle').textContent=st.title;
  leaf.classList.remove('static'); leaf.style.setProperty('--d0','800ms');
  leaf.innerHTML=leafHTML(st,0); leaf.scrollTop=0;
  setSleep(); updateChrome();
  show('reader', true);
  sky.target=.006;
  fxReader.ps=[]; fxReader.type=st.particle; fxReader.cols=particleCols(st); fxReader.ambient=st.particle==='cloud'?.25:1.1;
  page.animate([{opacity:0,transform:'translateY(60vh) rotateX(-35deg) scale(.7)'},{opacity:1,transform:'translateY(-14px) rotateX(6deg) scale(1.02)',offset:.7},{opacity:1,transform:'none'}],{duration:dur(950),delay:dur(100),easing:'cubic-bezier(.2,.8,.3,1)',fill:'backwards'});
  slot.animate([{opacity:0,transform:'translate(-120%,-90px) rotate(-25deg)'},{opacity:1,transform:'translate(0,-50px) rotate(10deg)',offset:.55},{opacity:1,transform:'translate(0,0) scale(1.12,.88)',offset:.8},{opacity:1,transform:'none'}],{duration:dur(900),delay:dur(800),easing:'ease-out',fill:'backwards'});
  $('#rHead').animate([{opacity:0,transform:'translateY(-40px)'},{opacity:1,transform:'none'}],{duration:dur(600),delay:dur(300),easing:'ease-out',fill:'backwards'});
  $('#rNav').animate([{opacity:0,transform:'translateY(40px)'},{opacity:1,transform:'none'}],{duration:dur(600),delay:dur(450),easing:'ease-out',fill:'backwards'});
  setTimeout(()=>{ if(scene==='reader'&&cur===i&&pg===0){ say('اقرأ لي حكاية!'); pawWave(); } },dur(1900));
}
async function turn(dir){
  const st=STORIES[cur], n=st.pages.length, np=pg+dir;
  if(busy||np<0||np>=n) return;
  busy=true;
  const flip=document.createElement('div'); flip.className='flip static';
  const D=dur(850), E='cubic-bezier(.45,.05,.3,1)';
  leaf.style.setProperty('--d0','250ms');
  if(dir>0){
    flip.innerHTML=leaf.innerHTML; page.insertBefore(flip, slot);
    pg=np; leaf.classList.remove('static'); leaf.innerHTML=leafHTML(st,pg); leaf.scrollTop=0;
    await flip.animate([{transform:'rotateY(0deg)'},{transform:'rotateY(180deg)'}],{duration:D,easing:E,fill:'forwards'}).finished;
  } else {
    pg=np; flip.innerHTML=leafHTML(st,pg); page.insertBefore(flip, slot);
    await flip.animate([{transform:'rotateY(180deg)'},{transform:'rotateY(0deg)'}],{duration:D,easing:E,fill:'forwards'}).finished;
    leaf.classList.add('static'); leaf.innerHTML=flip.innerHTML; leaf.scrollTop=0;
  }
  flip.remove();
  setSleep(); updateChrome();
  const s=pg/(n-1), pr=page.getBoundingClientRect();
  fxReader.burst('star',14,(dir>0?pr.right-10:pr.left+10)*DPR,(pr.top+pr.height*.4)*DPR,{cols:['#fff','#ffd166'],speed:[100,380],scale:.55});
  worldGust();
  if(dir>0){
    if(pg<n-1) heroAct(ACTS[(pg-1)%ACTS.length]);
    if(s<.6) hop(s<.3);
    if(s>.2 && s<.99){ slot.classList.remove('yawn'); void slot.offsetWidth; slot.classList.add('yawn'); setTimeout(()=>slot.classList.remove('yawn'),1800); }
    if(pg===n-2) say('كِدتُ… أنام…',2200);
    else if(s<.6 && Math.random()<.7) setTimeout(()=>say(CHAT[(Math.random()*CHAT.length)|0],2000),dur(700));
  }
  if(pg===n-1){ readSet.add(cur); saveRead(); bubble.classList.remove('show'); }
  busy=false;
}
$('#next').onclick=()=>turn(1); $('#prev').onclick=()=>turn(-1);
function bunnyTap(){
  const n=STORIES[cur].pages.length;
  if(pg===n-1) goHome();
  else { slot.classList.remove('wiggle'); void slot.offsetWidth; slot.classList.add('wiggle'); hop(true);
    const [x,y]=centerOf(slot); fxReader.burst('heart',10,x*DPR,(y-30)*DPR,{cols:['#ff6f8f','#ffb3cf','#ff8fb1'],speed:[100,300],up:120,scale:.8});
    say(pg>=n-3?'بضع صفحات أخرى…':TAPS[(Math.random()*TAPS.length)|0]); }
}
slot.addEventListener('click', bunnyTap);
slot.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); bunnyTap(); }});
let sx=null;
page.addEventListener('pointerdown',e=>{ if(!e.target.closest('.bunny-slot')) sx=e.clientX; });
page.addEventListener('pointerup',e=>{ if(sx===null) return; const dx=e.clientX-sx; sx=null; if(Math.abs(dx)>50) turn(dx>0?1:-1); });

async function goHome(){
  if(scene!=='reader') return;
  fxReader.ambient=0; token++;
  const [x,y]=centerOf(slot);
  fxReader.burst('star',40,x*DPR,y*DPR,{cols:GOLD,speed:[200,700],scale:.8});
  sky.target=1.4;
  await flash('#fffbe8',350,0,1);
  $('#world').classList.remove('on');
  buildGalaxy();
  show('galaxy', true);
  const next = STORIES.findIndex((_,k)=>!readSet.has(k));
  const target = strip.children[next>=0?next:cur];
  if(target){ const sr=strip.getBoundingClientRect(), r=target.getBoundingClientRect(); strip.scrollBy({left:(r.left+r.width/2)-(sr.left+sr.width/2)}); }
  galaxyEnter();
  flash('#fffbe8',800,1,0);
  await wait(600); sky.target=.02; fxReader.ps=[];
}
$('#back').onclick=goHome;

addEventListener('keydown',e=>{
  if(scene==='reader'){ if(e.key==='ArrowLeft') turn(1); else if(e.key==='ArrowRight') turn(-1); else if(e.key==='Escape') goHome(); }
  else if(scene==='galaxy'){ if(e.key==='ArrowLeft') nudge(-1); else if(e.key==='ArrowRight') nudge(1); }
  else if(scene==='intro' && (e.key==='Escape'||e.key===' ')) skipIntro();
});

resizeAll(); requestAnimationFrame(loop);
TT.start().then(bookEntrance);
</script>
